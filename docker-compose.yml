version: '3.8'

services:
  # ==========================================
  # PostgreSQL Database Service
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: hospital_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: hospital_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/000001_init_schema.up.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./migrations/seeds.sql:/docker-entrypoint-initdb.d/02_seeds.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hospital_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hospital_network

  # ==========================================
  # Go Backend Middleware Service
  # ==========================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hospital_app
    restart: unless-stopped
    environment:
      APP_ENV: production
      PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      DB_NAME: hospital_db
      DB_SSLMODE: disable
      JWT_SECRET: supersecretjwtkeyforhospitalmiddleware123456
      JWT_EXPIRY_HOURS: 24
      HOSPITAL_A_HIS_URL: https://hospital-a.api.co.th
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hospital_network

  # ==========================================
  # Nginx Reverse Proxy Service
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: hospital_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - app
    networks:
      - hospital_network

volumes:
  postgres_data:
    driver: local

networks:
  hospital_network:
    driver: bridge
